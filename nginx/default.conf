# Reverse proxy: / -> React container, /api/ -> Django container.
# The Host header is passed through unchanged because the backend identifies
# the tenant from the sub-domain (hospital-a.<domain>).

# Behind the AWS ALB the original scheme arrives in X-Forwarded-Proto; when
# running locally there is no ALB so fall back to nginx's own $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream frontend_app { server frontend:8080; }
upstream backend_app  { server backend:8000; }

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Used by the container HEALTHCHECK (proxy only, no backend dependency)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Load-balancer / probe endpoint. Host is rewritten because probes come
    # from an IP address, not a tenant sub-domain.
    location = /api/live/ {
        access_log off;
        proxy_pass http://backend_app;
        proxy_set_header Host localhost;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # X-Tenant-ID is passed through untouched; the backend only honours it
        # when ALLOW_TENANT_HEADER=true (local dev), which is false in AWS.
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
