
name: Deploy

# Used in two ways:
# 1. Automatically called by ci.yml for DEV and STAGING.
# 2. Manually triggered for DEV, STAGING, PROD or rollback.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - staging
          - prod
        required: true

      action:
        description: Deploy a specific image tag or rollback
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

      image_tag:
        description: Image tag (commit SHA) to deploy
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # GitHub Environment and production approval gate
    environment:
      name: ${{ inputs.environment }}

    # Production deployment only from main
    if: inputs.environment != 'prod' || github.ref == 'refs/heads/main'

    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      APP_URL: ${{ vars.APP_URL }}
      TENANT_HOSTS: ${{ vars.TENANT_HOSTS }}
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT: healthcare

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. AWS OIDC AUTHENTICATION
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402372753653:role/github-actions-devops-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # --------------------------------------------------------
      # 3. VERIFY AWS IDENTITY
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # 4. DECIDE IMAGE TAG
      # --------------------------------------------------------
      - name: Decide which tag to deploy
        id: tag
        shell: bash
        run: |
          if [ "${{ inputs.action }}" = "rollback" ]; then
            TAG=$(aws ssm get-parameter \
              --name "/$PROJECT/$ENVIRONMENT/previous_image_tag" \
              --query 'Parameter.Value' \
              --output text)

            echo "Rolling back $ENVIRONMENT to previous tag: $TAG"
          else
            TAG="${{ inputs.image_tag }}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No image tag provided"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "### Deploying \`$TAG\` to **$ENVIRONMENT**" \
            >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------
      # 5. VERIFY ECR IMAGES
      # --------------------------------------------------------
      - name: Verify all three images exist in ECR
        run: |
          for img in backend frontend nginx; do

            echo "Checking healthcare-$img:$TAG"

            aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$PROJECT-$img" \
              --image-ids imageTag="${{ steps.tag.outputs.tag }}" \
              --query 'imageDetails[0].imageTags' \
              --output text \
              >/dev/null \
              || {
                echo "::error::Image $PROJECT-$img:${{ steps.tag.outputs.tag }} not found"
                exit 1
              }

          done
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      # --------------------------------------------------------
      # 6. PACKAGE DEPLOYMENT BUNDLE
      # --------------------------------------------------------
      - name: Package and upload deployment bundle to S3
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          mkdir -p bundle/scripts

          cp docker/docker-compose.prod.yml bundle/

          cp database/tenants/tenants.json bundle/

          cp scripts/host/*.sh database/scripts/*.sh bundle/scripts/

          aws s3 sync bundle \
            "s3://$ARTIFACTS_BUCKET/deploy/$TAG/" \
            --delete \
            --sse AES256

      # --------------------------------------------------------
      # 7. DEPLOY USING AWS SYSTEMS MANAGER
      # --------------------------------------------------------
      - name: Run deployment on the host (AWS SSM)
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          PARAMS=$(jq -nc \
            --arg bucket "$ARTIFACTS_BUCKET" \
            --arg tag "$TAG" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -euo pipefail",
                "aws s3 sync s3://\($bucket)/deploy/\($tag)/ /opt/healthcare/ --region \($region)",
                "chmod +x /opt/healthcare/scripts/*.sh",
                "/opt/healthcare/scripts/bootstrap_rds.sh",
                "/opt/healthcare/scripts/deploy.sh \($tag)"
              ]
            }')

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG to $ENVIRONMENT" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId \
            --output text)

          echo "SSM command: $CMD_ID"

          STATUS="Pending"

          for i in $(seq 1 90); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output yaml

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Host deployment failed with status $STATUS"
            exit 1
          fi

      # --------------------------------------------------------
      # 8. APPLICATION HEALTH CHECK
      # --------------------------------------------------------
      - name: Post-deployment health check
        shell: bash
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL not configured. Skipping health check."
            exit 0
          fi

          for i in $(seq 1 30); do

            BODY=$(curl -fsS --max-time 10 \
              "$APP_URL/api/health/" || true)

            if echo "$BODY" | grep -q '"status": "ok"'; then
              echo "Health check successful: $BODY"
              exit 0
            fi

            if [ "$i" = 30 ]; then
              echo "::error::Application health check failed: $BODY"
              exit 1
            fi

            sleep 10
          done

      # --------------------------------------------------------
      # 9. TENANT SMOKE TEST
      # --------------------------------------------------------
      - name: Smoke test - every tenant
        shell: bash
        run: |
          if [ -z "$TENANT_HOSTS" ]; then
            echo "::warning::TENANT_HOSTS not configured. Skipping tenant tests."
            exit 0
          fi

          for host in $TENANT_HOSTS; do

            OUT=$(curl -fsS --max-time 10 \
              -H "Host: $host" \
              "$APP_URL/api/tenant/")

            echo "$host -> $OUT"

          done

      # --------------------------------------------------------
      # 10. DEPLOYMENT SUMMARY
      # --------------------------------------------------------
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"

          echo "- Environment: **$ENVIRONMENT**" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Image tag: **${{ steps.tag.outputs.tag }}**" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Status: **${{ job.status }}**" \
            >> "$GITHUB_STEP_SUMMARY"
