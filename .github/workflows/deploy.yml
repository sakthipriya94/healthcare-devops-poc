name: Deploy

# Used two ways:
#  * called automatically by ci.yml (dev on develop, staging on main)
#  * run manually (Actions -> Deploy -> Run workflow) for staging/prod or to ROLL BACK.
#
# Production safety: the `prod` GitHub Environment is configured with required
# reviewers, so the job below pauses until an approver clicks "Approve".
on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      image_tag: { required: true, type: string }
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        description: deploy a specific image tag, or roll back to the previous one
        type: choice
        options: [deploy, rollback]
        default: deploy
      image_tag:
        description: Image tag (commit SHA) to deploy - ignored for rollback
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt a deployment half-way

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Environment-scoped variables + (for prod) manual approval gate
    environment: ${{ inputs.environment }}
    # Production may only be deployed from main
    if: inputs.environment != 'prod' || github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      APP_URL: ${{ vars.APP_URL }}               # e.g. https://hospital-a.example.com or http://<alb-dns>
      TENANT_HOSTS: ${{ vars.TENANT_HOSTS }}     # e.g. "hospital-a.example.com hospital-b.example.com"
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT: healthcare
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, role scoped to this environment)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Decide which tag to deploy
        id: tag
        run: |
          if [ "${{ inputs.action }}" = "rollback" ]; then
            TAG="$(aws ssm get-parameter --name "/$PROJECT/$ENVIRONMENT/previous_image_tag" --query Parameter.Value --output text)"
            echo "Rolling back $ENVIRONMENT to previous tag: $TAG"
          else
            TAG="${{ inputs.image_tag }}"
          fi
          [ -n "$TAG" ] || { echo "::error::No image tag given"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`$TAG\` to **$ENVIRONMENT**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all three images exist in ECR
        run: |
          for img in backend frontend nginx; do
            aws ecr describe-images --repository-name "$PROJECT-$img" \
              --image-ids imageTag="${{ steps.tag.outputs.tag }}" --query 'imageDetails[0].imageTags' --output text >/dev/null \
              || { echo "::error::Image $PROJECT-$img:${{ steps.tag.outputs.tag }} not found"; exit 1; }
          done

      - name: Package and upload deployment bundle to S3
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p bundle/scripts
          cp docker/docker-compose.prod.yml bundle/
          cp database/tenants/tenants.json bundle/
          cp scripts/host/*.sh database/scripts/*.sh bundle/scripts/
          aws s3 sync bundle "s3://$ARTIFACTS_BUCKET/deploy/$TAG/" --delete --sse AES256

      - name: Run deployment on the host (AWS Systems Manager - no SSH)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PARAMS=$(jq -nc --arg bucket "$ARTIFACTS_BUCKET" --arg tag "$TAG" --arg region "$AWS_REGION" '{commands: [
            "set -euo pipefail",
            "aws s3 sync s3://\($bucket)/deploy/\($tag)/ /opt/healthcare/ --region \($region)",
            "chmod +x /opt/healthcare/scripts/*.sh",
            "/opt/healthcare/scripts/bootstrap_rds.sh",
            "/opt/healthcare/scripts/deploy.sh \($tag)"
          ]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG to $ENVIRONMENT" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output yaml
          [ "$STATUS" = "Success" ] || { echo "::error::Host deployment ended with status $STATUS (the host rolls back automatically)"; exit 1; }

      - name: Post-deployment health check (through the load balancer)
        run: |
          [ -n "$APP_URL" ] || { echo "::warning::APP_URL not set - skipping external check"; exit 0; }
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 10 "$APP_URL/api/health/" || true)
            echo "$BODY" | grep -q '"status": "ok"' && { echo "health OK: $BODY"; break; }
            [ "$i" = 30 ] && { echo "::error::Health check failed: $BODY"; exit 1; }
            sleep 10
          done

      - name: Smoke test - every tenant resolves and answers
        run: |
          for h in $TENANT_HOSTS; do
            OUT=$(curl -fsS --max-time 10 -H "Host: $h" "$APP_URL/api/tenant/")
            echo "$h -> $OUT"
          done

      - name: Summary
        if: always()
        run: |
          echo "- status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- if failed, the host already rolled back to the previous tag; to roll back manually run this workflow with action=rollback" >> "$GITHUB_STEP_SUMMARY"
