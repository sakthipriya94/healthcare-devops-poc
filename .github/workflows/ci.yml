
name: CI / CD

# develop -> builds, scans, pushes images, auto-deploys to DEV
# main    -> builds, scans, pushes images, auto-deploys to STAGING
# prod    -> manual deployment through Deploy workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: healthcare

jobs:

  # ------------------------------------------------------------
  # 1. BACKEND VALIDATION
  # ------------------------------------------------------------
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r backend/requirements-dev.txt

      - name: Flake8
        working-directory: backend
        run: flake8 .

      - name: Tenant-isolation tests
        working-directory: backend
        env:
          TENANT_DB_ENGINE: sqlite
          TENANTS_FILE: ../database/tenants/tenants.json
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test -v 2

  # ------------------------------------------------------------
  # 2. FRONTEND BUILD
  # ------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------
  # 3. DOCKER COMPOSE + SHELL VALIDATION
  # ------------------------------------------------------------
  config:
    name: Compose + shell validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker compose config (local stack)
        run: docker compose -f docker/docker-compose.yml --env-file .env.example config -q

      - name: Docker compose config (server stack)
        env:
          AWS_REGION: ap-south-1
          APP_ENV: dev
          ECR_REGISTRY: 123456789012.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ci
        run: |
          sudo mkdir -p /opt/healthcare
          sudo touch /opt/healthcare/.env
          docker compose -f docker/docker-compose.prod.yml config -q

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/host/*.sh database/scripts/*.sh database/init/*.sh docker/*.sh

  # ------------------------------------------------------------
  # 4. BUILD, SCAN AND PUSH DOCKER IMAGES
  # ------------------------------------------------------------
  images:
    name: Image ${{ matrix.image }} (build, scan, push)

    needs: [backend, frontend, config]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            dockerfile: docker/backend.Dockerfile

          - image: frontend
            dockerfile: docker/frontend.Dockerfile

          - image: nginx
            dockerfile: nginx/Dockerfile

    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # BUILD IMAGE
      # --------------------------------------------------------
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # --------------------------------------------------------
      # TRIVY SECURITY SCAN
      # --------------------------------------------------------
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          trivyignores: .trivyignore

      # --------------------------------------------------------
      # DEBUG GITHUB OIDC CLAIMS
      # --------------------------------------------------------
      - name: Debug GitHub OIDC claims
        if: env.PUSH == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('GitHub repository:', payload.repository);
            console.log('GitHub ref:', payload.ref);

      # --------------------------------------------------------
      # AWS OIDC AUTHENTICATION
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402372753653:role/github-actions-devops-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # --------------------------------------------------------
      # VERIFY AWS IDENTITY
      # --------------------------------------------------------
      - name: Verify AWS identity
        if: env.PUSH == 'true'
        run: aws sts get-caller-identity

      # --------------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # PUSH IMAGE TO ECR
      # --------------------------------------------------------
      - name: Push to ECR (immutable tag = commit SHA)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.image }}

  # ------------------------------------------------------------
  # 5. AUTOMATIC DEPLOYMENT TO DEV
  # ------------------------------------------------------------
  deploy-dev:
    name: Deploy to DEV

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: images

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: dev
      image_tag: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    secrets: inherit

  # ------------------------------------------------------------
  # 6. AUTOMATIC DEPLOYMENT TO STAGING
  # ------------------------------------------------------------
  deploy-staging:
    name: Deploy to STAGING

    if: false # Local-only POC: AWS deployment disabled

    needs: images

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: staging
      image_tag: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    secrets: inherit
